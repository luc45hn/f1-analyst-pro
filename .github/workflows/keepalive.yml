name: Keepalive

on:
  schedule:
    - cron: '0 10 * * 1,4'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary sqlalchemy

      - name: Run keepalive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEMETRY_DB_URL: ${{ secrets.TELEMETRY_DB_URL }}
        run: python scripts/keepalive.py
